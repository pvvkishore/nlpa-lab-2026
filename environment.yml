name: nlpa_2026
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    # Notebook environment
    - jupyterlab
    - ipywidgets
    # Local LLM client
    - ollama
    - openai
    # Classical tokenizers
    - nltk
    - spacy
    - sacremoses
    - stanza
    # Learned tokenizers
    - transformers
    - tokenizers
    - sentencepiece
    - tiktoken
    # Deep learning + vectors
    - torch
    - numpy
    - pandas
    - scikit-learn
    - matplotlib
    # Lab 05 — pretrained embeddings
    - gensim
    - sentence-transformers